  "knowledge_to_capture": [
    "Claude Code repeats one turn's usage across every record of that turn; group by message id before summing anything.",
    "Codex records both token usage and subscription quota (plan_type, used_percent, window_minutes, resets_at) in its rollout files; Claude Code records tokens but no quota; Antigravity records neither.",
    "In agent sessions, cached input is 96-99% of all input volume, so any cost model that blends token classes is wrong by roughly an order of magnitude."
