  "notes": [
    "Rates are deliberately absent from the code. A price recalled by a model has a short half-life, and a wrong rate that looks authoritative is worse than no rate, so the table is user-supplied and rejected without an as_of date and a source.",
    "The four token classes stay separate from collection through to the report. A pricing test uses a 99% cached shape and asserts 51.45 rather than the ~309 a blended input rate would produce.",
    "The first version of the network-boundary guard matched the word 'socket' in the module's own docstring. It now parses imports with ast, and a companion test proves the guard still fails on a real network import."
