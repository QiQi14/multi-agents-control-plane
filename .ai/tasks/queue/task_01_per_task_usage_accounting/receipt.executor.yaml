      "summary": "Estimating tokens from word or character counts was researched and rejected as the fallback.",
      "source_receipt_id": "task_01_per_task_usage_accounting-executor-1",
      "state": "resolved",
      "resolution": "Measured on real sessions: input outweighs output by 300-640x, 96-99% of input is cached, and 22-39% of output is reasoning that never appears as text. Agent cost is context re-read per turn, which no word count predicts. The fallback estimates per STEP from a calibration learned off tools that do measure."
